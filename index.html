<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WD BNI & MANDIRI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Inter',sans-serif;
}


html,body{
    margin:0;
    min-height:100vh;
}

body{
    min-height:100vh;
    overflow-x:hidden;

    background:
    radial-gradient(circle at top left, rgba(99,102,241,.25), transparent 40%),
    radial-gradient(circle at bottom right, rgba(34,211,238,.18), transparent 45%),
    linear-gradient(135deg,#020617,#0b1220,#0f172a);
}


.overlay{
    position:fixed;
    inset:0;

    background:
    linear-gradient(
        180deg,
        rgba(255,255,255,.02),
        rgba(255,255,255,0)
    );

    z-index:0;
    pointer-events:none;
}

.container{
    width:92%;
    max-width:860px;
    margin:50px auto;
    padding:26px;

    background:rgba(8,12,24,.72);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(148,163,184,.12);
    border-radius:26px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.05);
}

.title{
    text-align:center;

    font-size:30px;
    font-weight:800;

    margin-bottom:25px;

    background:
    linear-gradient(
        90deg,
        #ffffff,
        #60a5fa,
        #ffffff
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    position:relative;
}

.title::after{
    content:"";

    position:absolute;

    left:50%;
    bottom:-10px;

    transform:translateX(-50%);

    width:180px;
    height:4px;

    border-radius:20px;

    background:
    linear-gradient(
        90deg,
        transparent,
        #60a5fa,
        #ffffff,
        #60a5fa,
        transparent
    );
}

.input-box{
    background:rgba(15,23,42,.65);
    border:1px solid rgba(148,163,184,.12);
    border-radius:18px;
    padding:10px;
    transition:.25s;
}

.input-box:focus-within{
    border-color:#3b82f6;
    box-shadow:0 0 0 4px rgba(59,130,246,.12);
}


textarea{
    width:100%;
    min-height:260px;
    background:transparent;
    border:none;
    outline:none;
    resize:none;

    color:#e2e8f0;
    font-size:15px;
    line-height:1.7;
    padding:14px;
}


textarea::placeholder{
    color:#64748b;
}

textarea:focus{
    box-shadow:
    0 0 0 4px rgba(96,165,250,.15);

    border-radius:15px;
}

.result-value{
    margin-top:15px;

    padding:15px;

    min-height:60px;

    border-radius:16px;

    background:rgba(255,255,255,.03);

    border:1px solid rgba(255,255,255,.06);

    color:#93c5fd;

    font-size:22px;
    font-weight:700;
}

.button-box{
    display:flex;
    justify-content:center;
    opacity:0;
    max-height:0;
    overflow:hidden;
    pointer-events:none;
    transition:.35s ease;
}

.button-box.show{
    opacity:1;
    max-height:none;
    overflow:visible;
    margin-top:16px;
    pointer-events:auto;
}

.buttons{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    gap:12px;
}


.btn-wrapper{
    width:100%;
    display:flex;
    justify-content:center;
}

.btn{
    width:100%;
    height:54px;

    border:none;
    border-radius:14px;
    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    font-size:13px;
    font-weight:700;
    letter-spacing:.5px;

    color:#fff;

    transition:.25s ease;
    position:relative;
    overflow:hidden;
}

.btn .icon{
    font-size:18px;
}

.btn::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(255,255,255,.08);
    opacity:0;
    transition:.25s;
}

.btn:hover::after{opacity:1}

.btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 10px 25px rgba(0,0,0,.35),
        0 0 18px rgba(96,165,250,.15);

    filter:brightness(1.08);
}

.btn.success{
    background:linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    ) !important;

    color:#fff;
}

.btn1{
    background:linear-gradient(
        135deg,
        #334155,
        #475569
    );

    border:1px solid rgba(96,165,250,.18);
}

.btn2{
    background:linear-gradient(
        135deg,
        #1e293b,
        #334155
    );

    border:1px solid rgba(96,165,250,.18);
}

.brand{
    margin-top:14px;

    display:block;
    width:fit-content;

    margin-left:auto;
    margin-right:auto;

    font-size:9px;

    font-weight:600;
    letter-spacing:0.6px;

    color:rgba(255,255,255,0.9);

    padding:2px 6px;   

    border-radius:6px;

    border:1px solid rgba(96,165,250,0.25);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:0 6px 18px rgba(0,0,0,0.2);
	text-shadow:
    0 1px 2px rgba(0,0,0,0.8),
    0 0 8px rgba(255,255,255,0.15);
}

@media(max-width:600px){
    .container{
        margin:18px;
        padding:18px;
    }

    .hero h1{
        font-size:32px;
    }
}

.light{
    position:fixed;
    border-radius:50%;
    filter:blur(140px);
    z-index:0;
    pointer-events:none;
}
.light1{
    width:260px;
    height:260px;
    background:#3b82f6;
    opacity:.15;

    top:-100px;
    left:-100px;
}

.light2{
    width:260px;
    height:260px;
    background:#22d3ee;
    opacity:.10;

    bottom:-100px;
    right:-100px;
}

.header-box{
    text-align:center;

    margin-bottom:18px;

    padding-top:10px;
}

.header-text{
    font-size:42px;

    font-weight:800;

    color:white;

    letter-spacing:1px;
}

.header-subtitle{
    color:#64748b;

    font-size:12px;

    letter-spacing:4px;

    margin-top:5px;
}

.hero{
    text-align:center;
    margin-bottom:22px;
}

.hero h1{
    font-size:40px;
    font-weight:800;
    letter-spacing:1px;

    color:#e5e7eb;

    text-shadow:
        0 2px 8px rgba(0,0,0,.35);

    margin-bottom:5px;
}

.hero p{
    font-size:11px;
    letter-spacing:5px;
    color:#94a3b8;
    margin-top:6px;
}

	
</style>
</head>
<body>

<div class="overlay"></div>

<div class="container">
    <div class="hero">
    <h1>CATAT WD</h1>
    <p>BNI & MANDIRI</p>
</div>

   


    <div class="input-box">
        <textarea id="nominal" placeholder="Masukkan Data" rows="5"></textarea>
    </div>

    

    <div class="button-box" id="buttonBox">

    <div class="buttons">

        <div class="btn-wrapper">
            <button class="btn btn1" onclick="copyIdNamaKet(this)">
                COPY NAMA ID
            </button>
        </div>

        <div class="btn-wrapper">
            <button class="btn btn2" onclick="copyNominal(2500, this)">
                COPY 2.500
            </button>
        </div>

        <div class="btn-wrapper">
            <button class="btn btn2" onclick="copyNominal(6500, this)">
                COPY 6.500
            </button>
        </div>

    </div>

</div>

</div> <!-- penutup container -->

<div class="brand">
    © 2026 | BY YOGIK
</div>

<script>



const nominal = document.getElementById("nominal");

const buttonBox = document.getElementById("buttonBox");

nominal.addEventListener("input", function(){

    if(this.value.trim() !== ""){
        buttonBox.classList.add("show");
    }else{
        buttonBox.classList.remove("show");
    }

});

function showToast(btn, text) {

    const originalText = btn.dataset.original || btn.innerText;
    btn.dataset.original = originalText;

    btn.innerText = text;
    btn.classList.add("success");

    setTimeout(() => {
        btn.innerText = originalText;
        btn.classList.remove("success");
    }, 1000);
}

function copyIdNamaKet(btn) {
    const raw = document.getElementById("nominal").value.trim();

    if (!raw) {
        showToast(btn, "DATA KOSONG");
        return;
    }

    const lines = raw.split("\n").map(x => x.trim()).filter(Boolean);

    let id = "";
    let ket = "";
    let nama = "";

    for (const line of lines) {

        if (!id && /^[a-zA-Z0-9_]{3,}$/.test(line) && !/withdraw|deposit/i.test(line)) {
            id = line;
        }

        if (/withdraw/i.test(line)) ket = "Withdraw";
        if (/deposit/i.test(line)) ket = "Deposit";

        if (/DANA|OVO|BANK/i.test(line) || line.includes(",")) {

            if (line.includes(",")) {
                const parts = line.split(",").map(x => x.trim());

                for (let i = parts.length - 1; i >= 0; i--) {
                    if (!/^\d+$/.test(parts[i])) {
                        nama = parts[i];
                        break;
                    }
                }

            } else {
                const words = line.split(/\s+/);

                if (/DANA|OVO|BANK/i.test(words[0])) words.shift();
                if (words.length && /^\d+$/.test(words[0])) words.shift();

                nama = words.join(" ");
            }
        }
    }

    if (!id || !ket || !nama) {
        showToast(btn, "FORMAT SALAH");
        return;
    }

    const hasil = `${nama}\t${id}\t${ket}`;

    navigator.clipboard.writeText(hasil)
        .then(() => {
            showToast(btn, "TERCOPY ✔");
            btn.classList.add("success");

            setTimeout(() => btn.classList.remove("success"), 1200);
        })
        .catch(() => showToast(btn, "GAGAL COPY"));
}


function copyNominal(adm, btn) {
    const raw = document.getElementById("nominal").value;

    if (!raw.trim()) {
        showToast(btn, "NOMINAL KOSONG");
        return;
    }

    const lines = raw.split("\n");

    let nominalValue = null;

    for (let line of lines) {
        if (/withdraw/i.test(line)) {
            const match = line.match(/\d{1,3}(?:,\d{3})+/g);

            if (match && match.length > 0) {
                nominalValue = parseInt(match[0].replace(/,/g, ""));
                break;
            }
        }
    }

    if (!nominalValue || isNaN(nominalValue)) {
        showToast(btn, "NOMINAL TIDAK ADA");
        return;
    }

    const total = nominalValue + adm;

    navigator.clipboard.writeText("-" + total)
        .then(() => {
            showToast(btn, "TERCOPY ✔");
            btn.classList.add("success");

            setTimeout(() => btn.classList.remove("success"), 1200);
        })
        .catch(() => showToast(btn, "GAGAL COPY"));
}
</script>
<div class="light light1"></div>
<div class="light light2"></div>

</body>
</html>
